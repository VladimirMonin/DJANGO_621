<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="post">
        <h3>{{ title }}</h3>
        <p>Текст поста: {{text}} </p>
        <p>Просмотры: {{ views }}</p>
        <p>Теги: {{ hash_tags }}</p>
        <p>Тег 0: {{ hash_tags.0 }}</p>
        <p>Теги JOIN {{ hash_tags|join:" " }}</p>
        <p>Главный автор: {{ authors.main }}</p>
        <p>Второстепенный автор: {{ authors.secondary }}</p>
        <p>Яблоко: {{ apple }}</p>
    </div>
    {{ post.title }}
    {{ post.test }}
</body>
</html>
